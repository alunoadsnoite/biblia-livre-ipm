name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Flutter
        run: |
          git clone https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Get Flutter packages
        run: cd flutter && flutter pub get --enforce-lockfile
      - name: Analyze
        run: cd flutter && flutter analyze
      - name: Test
        run: cd flutter && flutter test
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Install pinned Flutter
        run: |
          git clone https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build Linux bundle
        run: |
          cd flutter
          flutter pub get --enforce-lockfile
          flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: biblia-livre-linux-x86_64
          path: flutter/build/linux/x64/release/bundle/
