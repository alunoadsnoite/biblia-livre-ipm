name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Flutter
        run: |
          git clone https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout "$(cat .flutter-version)"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Get Flutter packages
        run: cd flutter && flutter pub get --enforce-lockfile
      - name: Analyze
        run: cd flutter && flutter analyze
      - name: Test
        run: cd flutter && flutter test
      - name: Build APKs for each ABI
        run: cd flutter && flutter build apk --release --split-per-abi
